# Tier 2: longer randomized work that does not belong on the pull-request path.
#
# A failure here is a real failure. Nothing in this file retries a failed
# correctness run to turn it green, and any fuzz crasher is uploaded so the
# input that produced it survives the run.
name: Nightly

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat:
    name: Repeated deterministic runs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      # Repetition is what catches a test that passes on ordering luck.
      - name: Ten consecutive runs
        run: go test ./... -count=10 -timeout 35m

      - name: Race detector, repeated
        run: go test -race ./... -count=3 -timeout 35m

  campaign:
    name: Randomized Raft schedules
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      # A fresh block of seeds every night, so coverage accumulates instead of
      # re-running the same schedules. A failure prints the exact seed, which
      # is all that is needed to replay it.
      - name: Ten thousand schedules
        env:
          RIVET_RAFT_SEEDS: "10000"
          RIVET_RAFT_BASE_SEED: ${{ github.run_number }}00000
        run: go test ./internal/raft/ -run TestRandomizedSchedules -v -timeout 40m

  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzDecodeCommand
          - FuzzDecodeFrame
          - FuzzDecodeSnapshot
          - FuzzRecoveryTruncation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Fuzz for ten minutes
        run: go test ./internal/storage/ -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 10m

      # A crasher is only useful if the input survives the runner.
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: internal/storage/testdata/fuzz/
          if-no-files-found: ignore
